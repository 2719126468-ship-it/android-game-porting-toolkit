name: Orbit Snake Android APK

on:
  push:
    branches: [main]
    tags:
      - "orbit-snake-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK (API 27+, ARMv7 + ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout AGPT
        uses: actions/checkout@v7.0.1
        with:
          path: agpt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android toolchain
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          test -x "$ANDROID_SDK_ROOT/ndk/26.3.11579264/ndk-build"

      - name: Checkout official SDL2 source
        uses: actions/checkout@v7.0.1
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: vendor/SDL2

      - name: Generate Android project from official SDL2 template
        working-directory: vendor/SDL2
        run: |
          chmod +x build-scripts/androidbuild.sh
          COPYSOURCE=1 ./build-scripts/androidbuild.sh org.agpt.orbitsnake "$GITHUB_WORKSPACE/agpt/examples/orbit-snake/src/main.c"
          test -f build/org.agpt.orbitsnake/app/jni/src/Android.mk
          test -f build/org.agpt.orbitsnake/app/src/main/java/org/libsdl/app/SDLActivity.java

      - name: Pin API, SDK, NDK and ARM ABIs
        working-directory: vendor/SDL2/build/org.agpt.orbitsnake
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          gradle = Path("app/build.gradle")
          text = gradle.read_text(encoding="utf-8")
          replacements = {
              "compileSdkVersion 34": "compileSdkVersion 35",
              "minSdkVersion 19": "minSdkVersion 27",
              "targetSdkVersion 34": "targetSdkVersion 35",
              "abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'":
                  "abiFilters 'armeabi-v7a', 'arm64-v8a'",
              'arguments "APP_PLATFORM=android-19"': 'arguments "APP_PLATFORM=android-27"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected Gradle setting not found: {old}")
              text = text.replace(old, new)
          text = text.replace(
              "android {",
              'android {\n    ndkVersion "26.3.11579264"',
              1,
          )
          gradle.write_text(text, encoding="utf-8")

          root_gradle = Path("build.gradle")
          root_text = root_gradle.read_text(encoding="utf-8")
          root_text = root_text.replace(
              "com.android.tools.build:gradle:8.1.1",
              "com.android.tools.build:gradle:8.6.1",
          )
          root_gradle.write_text(root_text, encoding="utf-8")

          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          wrapper_text = wrapper.read_text(encoding="utf-8")
          wrapper_text = wrapper_text.replace(
              "gradle-8.1.1-bin.zip",
              "gradle-8.7-bin.zip",
          )
          wrapper.write_text(wrapper_text, encoding="utf-8")

          app_name = Path("app/src/main/res/values/strings.xml")
          app_name.write_text(
              '<resources>\n    <string name="app_name">AGPT Orbit Snake</string>\n</resources>\n',
              encoding="utf-8",
          )

          application_mk = Path("app/jni/Application.mk")
          mk_text = application_mk.read_text(encoding="utf-8")
          mk_text = re.sub(r"^APP_ABI\s*:=.*$", "APP_ABI := armeabi-v7a arm64-v8a",
                           mk_text, flags=re.MULTILINE)
          mk_text = re.sub(r"^APP_PLATFORM\s*=.*$", "APP_PLATFORM=android-27",
                           mk_text, flags=re.MULTILINE)
          application_mk.write_text(mk_text, encoding="utf-8")
          PY
          grep -E 'compileSdkVersion|minSdkVersion|targetSdkVersion|abiFilters|ndkVersion' app/build.gradle
          grep -E 'APP_ABI|APP_PLATFORM' app/jni/Application.mk

      - name: Build debug APK
        working-directory: vendor/SDL2/build/org.agpt.orbitsnake
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK manifest, signature and ABIs
        working-directory: vendor/SDL2/build/org.agpt.orbitsnake
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          AAPT="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | tee "$GITHUB_WORKSPACE/dist/manifest-badging.txt"
          grep -F "package: name='org.agpt.orbitsnake'" "$GITHUB_WORKSPACE/dist/manifest-badging.txt"
          grep -F "sdkVersion:'27'" "$GITHUB_WORKSPACE/dist/manifest-badging.txt"
          grep -F "native-code:" "$GITHUB_WORKSPACE/dist/manifest-badging.txt"
          grep -F "armeabi-v7a" "$GITHUB_WORKSPACE/dist/manifest-badging.txt"
          grep -F "arm64-v8a" "$GITHUB_WORKSPACE/dist/manifest-badging.txt"
          unzip -Z1 "$APK" | sort > "$GITHUB_WORKSPACE/dist/apk-contents.txt"
          grep -Fx "lib/armeabi-v7a/libmain.so" "$GITHUB_WORKSPACE/dist/apk-contents.txt"
          grep -Fx "lib/arm64-v8a/libmain.so" "$GITHUB_WORKSPACE/dist/apk-contents.txt"
          grep -Fx "lib/armeabi-v7a/libSDL2.so" "$GITHUB_WORKSPACE/dist/apk-contents.txt"
          grep -Fx "lib/arm64-v8a/libSDL2.so" "$GITHUB_WORKSPACE/dist/apk-contents.txt"
          "$APKSIGNER" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/dist/agpt-orbit-snake-android-api27-arm32-arm64-debug.apk"
          cp "$GITHUB_WORKSPACE/agpt/LICENSE" "$GITHUB_WORKSPACE/dist/AGPT-MIT-LICENSE.txt"
          cp "$GITHUB_WORKSPACE/vendor/SDL2/LICENSE.txt" "$GITHUB_WORKSPACE/dist/SDL2-ZLIB-LICENSE.txt"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          dist = Path(os.environ["GITHUB_WORKSPACE"]) / "dist"
          apk = dist / "agpt-orbit-snake-android-api27-arm32-arm64-debug.apk"
          result = {
              "status": "apk_verified",
              "application_id": "org.agpt.orbitsnake",
              "min_sdk": 27,
              "target_sdk": 35,
              "native_abis": ["armeabi-v7a", "arm64-v8a"],
              "apk_filename": apk.name,
              "apk_size_bytes": apk.stat().st_size,
              "apk_sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
              "engine": "SDL2 2.32.10",
              "game_source_license": "MIT (original AGPT source)",
              "third_party_license": "zlib (SDL2)",
              "game_assets": "original vector rendering; no external game assets",
              "device_install_or_gameplay_tested": False
          }
          (dist / "build-report.json").write_text(
              json.dumps(result, indent=2) + "\\n", encoding="utf-8"
          )
          print(json.dumps(result, indent=2))
          PY

      - name: Upload APK and verification report
        uses: actions/upload-artifact@v4
        with:
          name: agpt-orbit-snake-android-api27-arm32-arm64
          path: |
            dist/agpt-orbit-snake-android-api27-arm32-arm64-debug.apk
            dist/AGPT-MIT-LICENSE.txt
            dist/SDL2-ZLIB-LICENSE.txt
            dist/build-report.json
            dist/manifest-badging.txt
            dist/apk-contents.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/orbit-snake-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/agpt-orbit-snake-android-api27-arm32-arm64-debug.apk \
            dist/AGPT-MIT-LICENSE.txt dist/SDL2-ZLIB-LICENSE.txt \
            --title "AGPT Orbit Snake $GITHUB_REF_NAME" \
            --notes "Original SDL2 sample game built for Android 8.1+ (API 27+). Includes ARMv7 and ARM64 ABIs. Debug-signed APK; uninstall an older build before installing a build signed by a different CI run. Source code: examples/orbit-snake. No DungeonRush assets are included."
