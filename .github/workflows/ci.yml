name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          python -m agpt --help
          python -m agpt patch --help
          python -m agpt patch apply --help

      - name: Build wheel and verify bundled Ghidra script
        run: |
          python -m pip wheel --no-deps --wheel-dir wheelhouse .
          python -c "import glob, zipfile; files=glob.glob('wheelhouse/*.whl'); assert len(files)==1, files; z=zipfile.ZipFile(files[0]); assert any(n.endswith('ghidra_scripts/AGPTExport.java') for n in z.namelist()), z.namelist()"
